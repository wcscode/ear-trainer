    <!-- PWA Manifest Dynamic Generation -->
    <script>
        const manifestJson = {
            "name": "Ear Trainer Pro",
            "short_name": "EarTrainer",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#0f172a",
            "theme_color": "#6366f1",
            "icons": [
                {
                    "src": "https://placehold.co/192x192/6366f1/ffffff?text=EarPro",
                    "sizes": "192x192",
                    "type": "image/png"
                },
                {
                    "src": "https://placehold.co/512x512/6366f1/ffffff?text=EarPro",
                    "sizes": "512x512",
                    "type": "image/png"
                }
            ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestJson)], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(manifestBlob);
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestURL;
        document.head.appendChild(link);

        // REGISTRO DO SERVICE WORKER COM ESTRATÉGIA CACHE-FIRST (OFFLINE PERMANENTE)
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'ear-trainer-v3';
                const ASSETS_TO_CACHE = [
                    './',
                    'index.html',
                    'https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css',
                    'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css',
                    'https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap'
                ];

                self.addEventListener('install', (e) => {
                    self.skipWaiting();
                    e.waitUntil(
                        caches.open(CACHE_NAME).then((cache) => {
                            return cache.addAll(ASSETS_TO_CACHE).catch(() => {});
                        })
                    );
                });

                self.addEventListener('activate', (e) => {
                    e.waitUntil(
                        caches.keys().then((keys) => {
                            return Promise.all(
                                keys.map((key) => {
                                    if (key !== CACHE_NAME) return caches.delete(key);
                                })
                            );
                        }).then(() => self.clients.claim())
                    );
                });

                self.addEventListener('fetch', (e) => {
                    e.respondWith(
                        caches.match(e.request).then((cachedResponse) => {
                            if (cachedResponse) return cachedResponse;
                            return fetch(e.request).then((networkResponse) => {
                                if (e.request.method === 'GET' && networkResponse.status === 200) {
                                    const responseClone = networkResponse.clone();
                                    caches.open(CACHE_NAME).then((cache) => {
                                        cache.put(e.request, responseClone);
                                    });
                                }
                                return networkResponse;
                            }).catch(() => {
                                return caches.match('index.html') || caches.match('./');
                            });
                        })
                    );
                });
            `;

            const swBlob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(swBlob);

            window.addEventListener('load', () => {
                navigator.serviceWorker.register(swUrl).catch(err => console.log('SW registration error:', err));
            });
        }
    </script>

    <!-- Web Audio & Core Logic Script -->
    <script>
        const NOTE_NAMES_PT = {
            "C": "Dó", "C#": "Dó sustenido", "Db": "Ré bemol", "D": "Ré", 
            "D#": "Ré sustenido", "Eb": "Mi bemol", "E": "Mi", "F": "Fá", 
            "F#": "Fá sustenido", "Gb": "Sol bemol", "G": "Sol", 
            "G#": "Sol sustenido", "Ab": "Lá bemol", "A": "Lá", 
            "A#": "Lá sustenido", "Bb": "Si bemol", "B": "Si",
            "E#": "Mi sustenido", "B#": "Si sustenido", "Cb": "Dó bemol",
            "C##": "Dó duplo sustenido", "D##": "Ré duplo sustenido", "F##": "Fá duplo sustenido", "G##": "Sol duplo sustenido"
        };

        const DEGREE_NAMES_PT = [
            "Primeiro grau", "Segundo grau", "Terceiro grau", "Quarto grau", 
            "Quinto grau", "Sexto grau", "Sétimo grau"
        ];

        const KEY_SEMITONES = {
            "C": 0, "C#": 1, "Db": 1, "D": 2, "D#": 3, "Eb": 3, 
            "E": 4, "F": 5, "F#": 6, "Gb": 6, "G": 7, "G#": 8, 
            "Ab": 8, "A": 9, "A#": 10, "Bb": 10, "B": 11
        };

        const ALL_KEYS = ["C", "C#", "Db", "D", "D#", "Eb", "E", "F", "F#", "Gb", "G", "G#", "Ab", "A", "A#", "Bb", "B"];

        const MAJOR_SCALES_NOTES = {
            "C":  ["C", "D", "E", "F", "G", "A", "B"],
            "C#": ["C#", "D#", "E#", "F#", "G#", "A#", "B#"],
            "Db": ["Db", "Eb", "F", "Gb", "Ab", "Bb", "C"],
            "D":  ["D", "E", "F#", "G", "A", "B", "C#"],
            "D#": ["D#", "E#", "F##", "G#", "A#", "B##", "C##"],
            "Eb": ["Eb", "F", "G", "Ab", "Bb", "C", "D"],
            "E":  ["E", "F#", "G#", "A", "B", "C#", "D#"],
            "F":  ["F", "G", "A", "Bb", "C", "D", "E"],
            "F#": ["F#", "G#", "A#", "B", "C#", "D#", "E#"],
            "Gb": ["Gb", "Ab", "Bb", "Cb", "Db", "Eb", "F"],
            "G":  ["G", "A", "B", "C", "D", "E", "F#"],
            "G#": ["G#", "A#", "B#", "C#", "D#", "E#", "F##"],
            "Ab": ["Ab", "Bb", "C", "Db", "Eb", "F", "G"],
            "A":  ["A", "B", "C#", "D", "E", "F#", "G#"],
            "A#": ["A#", "B#", "C##", "D#", "E#", "F##", "G##"],
            "Bb": ["Bb", "C", "D", "Eb", "F", "G", "A"],
            "B":  ["B", "C#", "D#", "E", "F#", "G#", "A#"]
        };

        const MAJOR_SCALE_INTERVALS = [0, 2, 4, 5, 7, 9, 11, 12];

        class AudioEngine {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.volume = 0.8;
                this.timbre = 'piano';
            }

            init() {
                if (!this.ctx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContextClass();
                    this.masterGain = this.ctx.createGain();
                    this.masterGain.gain.setValueAtTime(this.volume, this.ctx.currentTime);
                    this.masterGain.connect(this.ctx.destination);
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            unlock() {
                this.init();
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(0.0001, this.ctx.currentTime);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(0);
                    osc.stop(this.ctx.currentTime + 0.05);
                } catch(e) {}
            }

            setVolume(v) {
                this.volume = v;
                if (this.masterGain && this.ctx) {
                    this.masterGain.gain.setValueAtTime(this.volume, this.ctx.currentTime);
                }
            }

            setTimbre(t) {
                this.timbre = t;
            }

            getFreqFromAbsoluteSemitones(semitonesFromC4) {
                return 261.63 * Math.pow(2, semitonesFromC4 / 12);
            }

            playNote(freq, duration = 1.0, startTime = 0, gainLevel = 1.0) {
                this.unlock();
                const now = this.ctx.currentTime + startTime;

                const osc = this.ctx.createOscillator();
                const noteGain = this.ctx.createGain();

                if (this.timbre === 'piano') {
                    osc.type = 'triangle';
                    noteGain.gain.setValueAtTime(0, now);
                    noteGain.gain.linearRampToValueAtTime(0.7 * gainLevel, now + 0.02);
                    noteGain.gain.exponentialRampToValueAtTime(0.001 * gainLevel, now + duration);
                } else if (this.timbre === 'synth') {
                    osc.type = 'sawtooth';
                    noteGain.gain.setValueAtTime(0, now);
                    noteGain.gain.linearRampToValueAtTime(0.4 * gainLevel, now + 0.08);
                    noteGain.gain.exponentialRampToValueAtTime(0.001 * gainLevel, now + duration + 0.2);
                } else {
                    osc.type = 'sine';
                    noteGain.gain.setValueAtTime(0, now);
                    noteGain.gain.linearRampToValueAtTime(0.6 * gainLevel, now + 0.05);
                    noteGain.gain.exponentialRampToValueAtTime(0.001 * gainLevel, now + duration);
                }

                osc.frequency.setValueAtTime(freq, now);
                osc.connect(noteGain);
                noteGain.connect(this.masterGain);

                osc.start(now);
                osc.stop(now + duration + 0.3);
            }

            playChord(freqs, duration = 1.5, startTime = 0) {
                freqs.forEach(f => this.playNote(f, duration, startTime, 0.6));
            }
        }

        class EarTrainingApp {
            constructor() {
                this.audio = new AudioEngine();
                this.isRunning = false;
                this.selectedKey = 'C';
                this.voiceMode = 'note';
                this.responseTime = 3;

                this.speechVoice = null;
                this.initSpeech();

                this.toggleBtn = document.getElementById('toggleLoopBtn');
                this.keySelect = document.getElementById('keySelect');
                this.voiceModeSelect = document.getElementById('voiceModeSelect');
                this.timbreSelect = document.getElementById('timbreSelect');
                this.delayInput = document.getElementById('delayInput');
                this.delayValue = document.getElementById('delayValue');
                this.volumeInput = document.getElementById('volumeInput');
                this.volumeValue = document.getElementById('volumeValue');
                
                this.statusContainer = document.getElementById('statusContainer');
                this.statusBadge = document.getElementById('statusBadge');
                this.statusText = document.getElementById('statusText');
                this.statusSpinner = document.getElementById('statusSpinner');
                
                this.noteResultBox = document.getElementById('noteResultBox');
                this.targetNoteName = document.getElementById('targetNoteName');
                this.targetNoteDetail = document.getElementById('targetNoteDetail');
                this.progressBar = document.getElementById('progressBar');
                this.timerCountdown = document.getElementById('timerCountdown');

                this.bindEvents();
            }

            bindEvents() {
                this.toggleBtn.addEventListener('click', () => {
                    this.audio.unlock();
                    this.toggleLoop();
                });
                this.keySelect.addEventListener('change', (e) => {
                    this.selectedKey = e.target.value;
                });
                this.voiceModeSelect.addEventListener('change', (e) => {
                    this.voiceMode = e.target.value;
                });
                this.timbreSelect.addEventListener('change', (e) => {
                    this.audio.setTimbre(e.target.value);
                });
                this.delayInput.addEventListener('input', (e) => {
                    this.responseTime = parseInt(e.target.value, 10);
                    this.delayValue.textContent = `${this.responseTime}s`;
                });
                this.volumeInput.addEventListener('input', (e) => {
                    const volPercent = parseInt(e.target.value, 10);
                    this.volumeValue.textContent = `${volPercent}%`;
                    this.audio.setVolume(volPercent / 100);
                });
            }

            initSpeech() {
                if ('speechSynthesis' in window) {
                    const loadVoices = () => {
                        const voices = window.speechSynthesis.getVoices();
                        this.speechVoice = voices.find(v => v.lang.startsWith('pt')) || voices[0];
                    };
                    loadVoices();
                    if (speechSynthesis.onvoiceschanged !== undefined) {
                        speechSynthesis.onvoiceschanged = loadVoices;
                    }
                }
            }

            speak(text) {
                if ('speechSynthesis' in window && text) {
                    try {
                        window.speechSynthesis.cancel();
                        const utterance = new SpeechSynthesisUtterance(text);
                        if (this.speechVoice) utterance.voice = this.speechVoice;
                        utterance.lang = 'pt-BR';
                        utterance.rate = 1.0;
                        utterance.volume = Math.min(1.0, this.audio.volume * 1.2);
                        window.speechSynthesis.speak(utterance);
                    } catch (e) {
                        console.error('Erro na fala:', e);
                    }
                }
            }

            toggleLoop() {
                if (this.isRunning) {
                    this.stopLoop();
                } else {
                    this.startLoop();
                }
            }

            startLoop() {
                if (this.isRunning) return;

                this.audio.unlock();
                this.isRunning = true;
                this.toggleBtn.classList.remove('btn-glow');
                this.toggleBtn.classList.add('btn-danger-glow');
                this.toggleBtn.innerHTML = '<i class="fa-solid fa-stop me-2"></i> Parar Treino';
                this.statusContainer.classList.add('active-state');
                this.runLoop();
            }

            stopLoop() {
                this.isRunning = false;
                this.toggleBtn.classList.remove('btn-danger-glow');
                this.toggleBtn.classList.add('btn-glow');
                this.toggleBtn.innerHTML = '<i class="fa-solid fa-play me-2"></i> Iniciar Treino em Loop';
                this.statusContainer.classList.remove('active-state');
                this.statusBadge.className = 'badge bg-secondary mb-2 px-3 py-2 text-uppercase fw-semibold';
                this.statusBadge.textContent = 'Aguardando Início';
                this.statusText.textContent = 'Clique em "Iniciar Treino" para começar';
                this.statusSpinner.classList.add('d-none');
                this.noteResultBox.classList.add('d-none');
                this.updateProgress(0, '--');
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            }

            updateProgress(percent, text) {
                this.progressBar.style.width = `${percent}%`;
                this.timerCountdown.textContent = text;
            }

            async sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            async runLoop() {
                while (this.isRunning) {
                    await this.runCycle();
                }
            }

            async runCycle() {
                if (!this.isRunning) return;

                // 1. Determinar Tom Atual
                let rootKey = this.selectedKey;
                if (rootKey === 'RANDOM') {
                    rootKey = ALL_KEYS[Math.floor(Math.random() * ALL_KEYS.length)];
                }
                const rootIdx = KEY_SEMITONES[rootKey];
                const scaleNotes = MAJOR_SCALES_NOTES[rootKey] || MAJOR_SCALES_NOTES["C"];

                // 2. Tocar Cadência (I - IV - V - I)
                this.statusBadge.className = 'badge bg-primary mb-2 px-3 py-2 text-uppercase';
                this.statusBadge.textContent = `Tonalidade: ${rootKey} Maior`;
                this.statusText.textContent = 'Tocando Cadência de Fixação (I - IV - V - I)...';
                this.statusSpinner.classList.remove('d-none');
                this.noteResultBox.classList.add('d-none');

                const rootFreq = this.audio.getFreqFromAbsoluteSemitones(rootIdx);
                const thirdFreq = this.audio.getFreqFromAbsoluteSemitones(rootIdx + 4);
                const fifthFreq = this.audio.getFreqFromAbsoluteSemitones(rootIdx + 7);
                const fourthFreq = this.audio.getFreqFromAbsoluteSemitones(rootIdx + 5);
                const sixthFreq = this.audio.getFreqFromAbsoluteSemitones(rootIdx + 9);
                const secondFreq = this.audio.getFreqFromAbsoluteSemitones(rootIdx + 2);

                // Acorde I
                this.audio.playChord([rootFreq, thirdFreq, fifthFreq], 1.2, 0);
                await this.sleep(1200);
                if (!this.isRunning) return;

                // Acorde IV
                this.audio.playChord([fourthFreq, sixthFreq, rootFreq * 2], 1.2, 0);
                await this.sleep(1200);
                if (!this.isRunning) return;

                // Acorde V
                this.audio.playChord([fifthFreq, secondFreq, fourthFreq], 1.2, 0);
                await this.sleep(1200);
                if (!this.isRunning) return;

                // Acorde I
                this.audio.playChord([rootFreq, thirdFreq, fifthFreq], 1.5, 0);
                await this.sleep(1800);
                if (!this.isRunning) return;

                // 3. Sorteia nota alvo da escala maior (graus 1 a 7)
                const targetDegreeIndex = Math.floor(Math.random() * 7);
                const semitonesFromRoot = MAJOR_SCALE_INTERVALS[targetDegreeIndex];
                
                const targetAbsoluteSemitones = rootIdx + semitonesFromRoot;
                const targetNoteName = scaleNotes[targetDegreeIndex];
                const targetFreq = this.audio.getFreqFromAbsoluteSemitones(targetAbsoluteSemitones);

                // 4. Toca Nota Alvo
                this.statusText.textContent = 'Ouça a nota alvo... Tente identificar!';
                this.statusSpinner.classList.add('d-none');
                this.audio.playNote(targetFreq, 1.8, 0, 1.2);
                await this.sleep(800);

                // Suspense / Tempo de resposta configurável
                const totalSeconds = this.responseTime;
                for (let i = totalSeconds; i > 0; i--) {
                    if (!this.isRunning) return;
                    this.updateProgress(((totalSeconds - i + 1) / totalSeconds) * 100, `Resposta em ${i}s...`);
                    await this.sleep(1000);
                }

                if (!this.isRunning) return;

                // 5. Revelar Nota e Vocalizar
                const ptName = NOTE_NAMES_PT[targetNoteName] || targetNoteName;
                const degreeNumber = targetDegreeIndex + 1;
                const degreeSpeech = DEGREE_NAMES_PT[targetDegreeIndex];
                
                this.statusBadge.className = 'badge bg-success mb-2 px-3 py-2 text-uppercase';
                this.statusBadge.textContent = `Tom: ${rootKey} Maior`;
                this.statusText.textContent = `Nota Revelada!`;
                
                this.targetNoteName.textContent = targetNoteName;
                this.targetNoteDetail.textContent = `${ptName} (${degreeNumber}º Grau)`;
                this.noteResultBox.classList.remove('d-none');

                let speechText = "";
                if (this.voiceMode === 'note') {
                    speechText = ptName;
                } else if (this.voiceMode === 'degree') {
                    speechText = degreeSpeech;
                } else if (this.voiceMode === 'both') {
                    speechText = `${ptName}, ${degreeSpeech}`;
                }

                this.speak(speechText);

                await this.sleep(1200);
                if (!this.isRunning) return;

                // 6. Tocando Escala de Retorno baseada no grau e respeitando o tom selecionado
                this.statusText.textContent = degreeNumber <= 4 ? 
                    `Escala descendo até a tônica (${rootKey})...` : 
                    `Escala subindo até a tônica aguda (${rootKey})...`;

                if (degreeNumber <= 4) {
                    for (let d = targetDegreeIndex; d >= 0; d--) {
                        if (!this.isRunning) return;
                        const noteSemitones = rootIdx + MAJOR_SCALE_INTERVALS[d];
                        const freq = this.audio.getFreqFromAbsoluteSemitones(noteSemitones);
                        this.audio.playNote(freq, 0.5, 0, 0.9);
                        await this.sleep(450);
                    }
                } else {
                    for (let d = targetDegreeIndex; d <= 7; d++) {
                        if (!this.isRunning) return;
                        const noteSemitones = rootIdx + MAJOR_SCALE_INTERVALS[d];
                        const freq = this.audio.getFreqFromAbsoluteSemitones(noteSemitones);
                        this.audio.playNote(freq, 0.5, 0, 0.9);
                        await this.sleep(450);
                    }
                }

                await this.sleep(1500);
            }
        }

        // Initialize application on load
        window.addEventListener('DOMContentLoaded', () => {
            new EarTrainingApp();
        });
    </script>
